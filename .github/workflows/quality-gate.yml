name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate / node-${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install Control Center dependencies
        run: npm --prefix interfaces/control-center ci --ignore-scripts

      - name: Install portable Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt

      - name: Environment doctor
        run: node scripts/env-doctor.mjs

      - name: Quality gate
        run: node scripts/quality-gate.mjs

      - name: Distribution audit and bundled example
        run: |
          node scripts/distribution-check.mjs
          npm --prefix examples/brief-desk-nd/project test

      - name: Control Center typecheck and production build
        run: |
          npm --prefix interfaces/control-center run typecheck
          npm --prefix interfaces/control-center run build
